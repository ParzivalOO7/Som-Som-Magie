<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8ecea">
  <title>Som-Som-Magie | A small number puzzle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast" class="toast" role="alert" aria-live="assertive"></div>
  <main class="game-shell">
    <header class="game-header">
      <div class="brand-lockup"><span class="brand-mark" aria-hidden="true">+</span><span class="brand-name">Som-Som-Magie</span></div>
      <div class="live-status"><span class="live-dot"></span>LIVE PUZZLE</div>
    </header>
    <section class="game-content" aria-labelledby="game-title">
      <div class="stage-intro"><p class="eyebrow">NUMBER STUDY <span aria-hidden="true">/</span> 01</p><h1 id="game-title">Find the missing<br><em>magic.</em></h1></div>
      <div class="word-stage" aria-label="Number puzzle grid">
        <div class="stage-topline"><span>THE SIGNAL</span><span>4 × 4</span></div>
        <div class="number-grid">
          <input id="inp_A1" type="number" aria-label="Top left number" disabled><input id="inp_A2" type="number" aria-label="Top second number" disabled><input id="inp_A3" type="number" aria-label="Top third number" disabled><input id="inp_A4" type="number" aria-label="Top right number" disabled>
          <input id="inp_B1" type="number" aria-label="Second row left number" disabled><input id="inp_B2" type="number" aria-label="Missing number B2" placeholder="?"><input id="inp_B3" type="number" aria-label="Missing number B3" placeholder="?"><input id="inp_B4" type="number" aria-label="Second row right number" disabled>
          <input id="inp_C1" type="number" aria-label="Third row left number" disabled><input id="inp_C2" type="number" aria-label="Missing number C2" placeholder="?"><input id="inp_C3" type="number" aria-label="Missing number C3" placeholder="?"><input id="inp_C4" type="number" aria-label="Third row right number" disabled>
          <input id="inp_D1" type="number" aria-label="Bottom left number" disabled><input id="inp_D2" type="number" aria-label="Bottom second number" disabled><input id="inp_D3" type="number" aria-label="Bottom third number" disabled><input id="inp_D4" type="number" aria-label="Bottom right number" disabled>
        </div>
      </div>
      <div class="details-row"><div class="detail-panel"><span class="detail-label">CLUE</span><span class="detail-value">Fill the four open cells</span></div><div class="detail-panel detail-panel--right"><span class="detail-label">RULE</span><span class="detail-value">Add or multiply</span></div></div>
      <div class="actions"><button type="button" class="button button--primary" id="check-btn">Check answer <span aria-hidden="true">↗</span></button><button type="button" class="button button--secondary" id="generate-btn">New puzzle</button><button type="button" class="button button--text" id="reveal-btn">Reveal</button></div>
      <div class="utility-row"><div id="explanation" class="explanation"><span class="detail-label">METHOD</span><p id="explanation-text">Each visible number is made from the two hidden values beside it.</p></div><button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode"><span class="theme-toggle__icon" aria-hidden="true">◐</span><span class="theme-toggle__label">Contrast</span></button></div>
    </section>
    <footer class="game-footer"><span>MADE FOR CURIOUS MINDS</span><span>SM / 2024</span></footer>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
